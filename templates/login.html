<!DOCTYPE html>
<html>

<body>

<h1>Login</h1>
{% if error %}
<div>
    {{ error }}
</div>
{% endif %}
<form method="post">

    Username:
    <input
        type="text"
        name="username"
        value="{{ username or '' }}"
        >

    <br><br>

    Password:
    <input
        type="password"
        name="password">

    <br><br>

    <button type="submit">
        Login
    </button>

</form>

</body>
</html>
