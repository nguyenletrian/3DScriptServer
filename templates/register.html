<!DOCTYPE html>
<html>

<body>

<h1>Create Account</h1>


<form method="post">

{% if error %}
<div>
    {{ error }}
</div>
{% endif %}


<label>
Username
</label>

<input 
    name="username"
    value="{{ username or '' }}"
>


<label>
Password
</label>

<input 
    name="password"
    type="password"
>


<button>
Register
</button>

</form>


</body>

</html>
